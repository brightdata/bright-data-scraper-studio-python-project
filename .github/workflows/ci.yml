name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -c "import ast; ast.parse(open('index.py').read())"

      - name: Smoke run (no credentials)
        # Verifies the script gates correctly on missing config
        # and prints the friendly error before exiting cleanly.
        run: python index.py
        env:
          BRIGHT_DATA_API_TOKEN: ''
          BRIGHT_DATA_COLLECTOR_ID: ''
